<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.json">
<title>Metalúrgica Xavier</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="loginScreen" class="login-screen hidden">
  <div class="login-box">
    <img class="login-logo" src="logo.png" alt="MeX" onerror="this.style.display='none'">
    <h1>Entrar</h1>
    <form id="loginForm">
      <label>Usuário</label><input id="loginUser" autocomplete="username" required>
      <label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" required>
      <button class="primary login-button" type="submit">Entrar</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</section>

<div id="appShell" class="hidden">
<header class="topbar">
  <div><div class="brand">Metalúrgica Xavier</div><div class="subtitle">Peças e estruturas metálicas do seu jeito!</div></div>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
</header>

<main id="app">
  <section id="home" class="screen active">
    <div class="home-logo-wrap"><img src="logo.png" class="home-logo" alt="Logo" onerror="this.style.display='none'"></div>
    <h1>Início</h1>
    <div class="grid"><button class="card" data-go="clientes"><b>Clientes</b><span>Cadastrar e consultar clientes</span></button><button class="card" data-go="orcamentos"><b>Orçamentos</b><span>Criar e acompanhar propostas</span></button><button class="card" data-go="financeiro"><b>Financeiro</b><span>Acompanhar recebimentos</span></button></div>
  </section>
  <section id="clientes" class="screen"><div class="section-head"><h1>Clientes</h1><button class="primary" id="novoCliente">+ Novo</button></div><div id="clientesLista" class="list"></div></section>
  <section id="orcamentos" class="screen"><div class="section-head"><h1>Orçamentos</h1><button class="primary" id="novoOrcamento">+ Novo</button></div><div class="toolbar"><button id="filtroBtn" class="secondary">Filtro</button><div id="filtros" class="filters hidden"><button data-filter="todos">Todos</button><button data-filter="pendente">🟨 Pendente</button><button data-filter="aprovado">🟩 Aprovado</button><button data-filter="cancelado">🟥 Cancelado</button><button data-filter="concluido">🟦 Concluído</button><button data-filter="vencido">⬜ Vencido</button></div></div><div id="orcamentosLista" class="list"></div></section>
  <section id="financeiro" class="screen"><div class="section-head"><h1>Financeiro</h1></div><div class="tabs"><button class="tab active" data-tab="abertos">Abertos</button><button class="tab" data-tab="finalizados">Finalizados</button><button class="tab" data-tab="relatorio">Relatório</button></div><div id="financeiroLista" class="list"></div></section>
</main>
<nav class="bottom-nav"><button data-go="home">⌂<small>Início</small></button><button data-go="clientes">♙<small>Clientes</small></button><button data-go="orcamentos">▣<small>Orçamentos</small></button><button data-go="financeiro">R$<small>Financeiro</small></button></nav>
</div>

<div id="sideMenu" class="side-menu hidden"><div class="side-menu-box"><button id="menuClose" class="menu-close">×</button><button id="menuUser">👤 Usuário</button><button id="menuSettings">⚙ Ajustes</button><button id="menuLogout">⇥ Sair</button></div></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div class="modal-head"><h2 id="modalTitle"></h2><button id="fecharModal">×</button></div><div id="modalBody"></div></div></div>
<script>
(function(){
  if(location.protocol==='file:'){
    window.addEventListener('DOMContentLoaded',function(){
      const box=document.createElement('div');
      box.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif;';
      box.innerHTML='<div style="max-width:520px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center"><h2 style="margin:0 0 12px">Abra o MeX pelo servidor local</h2><p style="line-height:1.5;margin:0 0 12px">Para gerar o PDF usando <b>logo.png</b> e <b>zap.png</b> diretamente da pasta, o navegador precisa abrir o projeto por HTTP.</p><p style="line-height:1.5;margin:0 0 18px">Feche esta janela e execute <b>iniciar_meX.bat</b>.</p><button onclick="this.parentElement.parentElement.remove()" style="padding:10px 18px;border:0;border-radius:8px;cursor:pointer">Entendi</button></div>';
      document.body.appendChild(box);
    });
  }
})();
</script>
<script src="app.js"></script>
</body>
</html>
